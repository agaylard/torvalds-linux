%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/sunplus,sp7021-i2cm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sunplus SP7021 I2C master controller

maintainers:
  - Andrew Gaylard <ag@ffroot.co.za>
  - Li-hao Kuo <lhjeff911@gmail.com>

description:
  The SP7021 has four I2C master controllers. Each controller has its own
  DMA engine, which reads and writes the transfer data in memory. The DMA
  engines of all four controllers also need the clock of controller 0 to be
  on and its reset to be released, so every controller has that clock and
  reset as a second entry, named "dma". Controller 0 names its own clock
  and reset there.

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: sunplus,sp7021-i2cm

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Controller clock
      - description: Clock of controller 0, used by the DMA engine

  clock-names:
    items:
      - const: core
      - const: dma

  resets:
    items:
      - description: Controller reset
      - description: Reset of controller 0, used by the DMA engine

  reset-names:
    items:
      - const: core
      - const: dma

  clock-frequency:
    minimum: 13184
    maximum: 400000

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/sunplus,sp7021-clkc.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/reset/sunplus,sp7021-reset.h>

    i2c@9c004700 {
        compatible = "sunplus,sp7021-i2cm";
        reg = <0x9c004700 0x100>;
        interrupts = <175 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clkc CLK_I2CM1>, <&clkc CLK_I2CM0>;
        clock-names = "core", "dma";
        resets = <&rstc RST_I2CM1>, <&rstc RST_I2CM0>;
        reset-names = "core", "dma";
        clock-frequency = <100000>;
        pinctrl-names = "default";
        pinctrl-0 = <&i2cm1_pins>;
        #address-cells = <1>;
        #size-cells = <0>;

        eeprom@50 {
            compatible = "atmel,24c04";
            reg = <0x50>;
        };
    };
...
